{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:460px">
  <h1>Hesabım</h1>
  <p>Kullanıcı adı: <b>{{ g.user.username }}</b></p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Mevcut şifre</label><input type="password" name="old" autocomplete="current-password" required>
    <label>Yeni şifre (en az 8 karakter)</label><input type="password" name="new" autocomplete="new-password" required>
    <label>Yeni şifre (tekrar)</label><input type="password" name="new2" autocomplete="new-password" required>
    <button class="btn">Şifreyi değiştir</button>
  </form>
</div>
{% endblock %}
