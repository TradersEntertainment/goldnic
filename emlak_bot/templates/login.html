{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block body %}
<div class="card login">
  <h1>🏢 Giriş</h1>
  <form method="post" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Kullanıcı adı</label><input name="username" autocomplete="username" required autofocus>
    <label>Şifre</label><input type="password" name="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%">Giriş yap</button>
  </form>
  <p class="mute" style="font-size:13px">Kullanıcı adı ve şifrenizi Telegram botuna <code>/sifre kullaniciadi</code> yazarak alırsınız.</p>
</div>
{% endblock %}
